<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body bgcolor="black">
    <div class="container">
      <h1>To-Do List</h1>

      <input type="text" id="taskInput" placeholder="Enter a task" />
      <div class="controls">
        <br />
        <button id="addBtn">Add</button>

        <button id="resetBtn">Reset</button>
      </div>
      <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
