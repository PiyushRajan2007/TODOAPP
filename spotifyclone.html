<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spotify Clone</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background-color: #121212;
        color: white;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 220px;
        background-color: #000;
        padding: 20px;
      }

      .sidebar h2 {
        color: #1db954;
        margin-bottom: 20px;
      }

      .sidebar p {
        margin: 15px 0;
        cursor: pointer;
        color: #b3b3b3;
      }

      .sidebar p:hover {
        color: white;
      }

      /* Main */
      .main {
        flex: 1;
        padding: 20px;
      }

      .song-list {
        margin-top: 20px;
      }

      .song {
        padding: 12px;
        background: #181818;
        margin-bottom: 10px;
        cursor: pointer;
        border-radius: 6px;
      }

      .song:hover {
        background: #282828;
      }

      /* Player */
      .player {
        position: fixed;
        bottom: 0;
        width: 100%;
        background: #181818;
        padding: 15px;
      }

      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
      }

      button {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
      }

      button:hover {
        color: #1db954;
      }

      .progress {
        width: 100%;
        margin-top: 10px;
      }

      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>Spotify</h2>
        <p>Home</p>
        <p>Search</p>
        <p>Your Library</p>
      </div>

      <div class="main">
        <h1>My Playlist</h1>

        <div class="song-list" id="songList">
          <!-- Songs will be populated by JS -->
        </div>
      </div>
    </div>

    <div class="player">
      <div class="player-left">
        <div class="song-info">
          <img id="cover" src="https://via.placeholder.com/50" alt="Cover" />
          <div class="song-details">
            <h4 id="title">Song Title</h4>
            <p id="artist">Artist</p>
          </div>
        </div>
      </div>

      <div class="player-center">
        <div class="controls">
          <button onclick="prevSong()">⏮</button>
          <button id="playBtn" class="play-btn" onclick="togglePlay()">
            ▶️
          </button>
          <button onclick="nextSong()">⏭</button>
        </div>
        <div class="progress-container">
          <span id="currTime">0:00</span>
          <input type="range" value="0" id="progressBar" />
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <div class="volume-control">
          <span>🔊</span>
          <input
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            oninput="setVolume(this.value)"
          />
        </div>
      </div>
    </div>

    <script>
      // Advanced playlist with online songs (simulating Google/Web sources)
      const playlist = [
        {
          title: "Electro Vibes",
          artist: "Google Mix",
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
          cover: "https://via.placeholder.com/50/1DB954/FFFFFF?text=1",
        },
        {
          title: "Chill Beats",
          artist: "Google Mix",
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
          cover: "https://via.placeholder.com/50/1DB954/FFFFFF?text=2",
        },
        {
          title: "Deep Focus",
          artist: "Google Mix",
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
          cover: "https://via.placeholder.com/50/1DB954/FFFFFF?text=3",
        },
      ];

      let audio = new Audio();
      let currentSongIndex = 0;
      let isPlaying = false;

      const playBtn = document.getElementById("playBtn");
      const progressBar = document.getElementById("progressBar");
      const currTimeEl = document.getElementById("currTime");
      const durTimeEl = document.getElementById("durTime");
      const coverEl = document.getElementById("cover");
      const titleEl = document.getElementById("title");
      const artistEl = document.getElementById("artist");
      const songListEl = document.getElementById("songList");

      function init() {
        renderPlaylist();
        loadSong(currentSongIndex);
      }

      function renderPlaylist() {
        songListEl.innerHTML = "";
        playlist.forEach((song, index) => {
          const div = document.createElement("div");
          div.classList.add("song");
          div.innerHTML = `
            <img src="${song.cover}" style="width:40px; height:40px; border-radius:4px; margin-right:10px; vertical-align:middle;">
            <span style="vertical-align:middle;">${song.title} - ${song.artist}</span>
          `;
          div.onclick = () => playSong(index);
          songListEl.appendChild(div);
        });
      }

      function loadSong(index) {
        currentSongIndex = index;
        const song = playlist[index];
        audio.src = song.src;
        coverEl.src = song.cover;
        titleEl.innerText = song.title;
        artistEl.innerText = song.artist;
      }

      function playSong(index) {
        if (index !== currentSongIndex) {
          loadSong(index);
        }
        audio.play();
        isPlaying = true;
        updatePlayBtn();
      }

      function togglePlay() {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          audio.play();
          isPlaying = true;
        }
        updatePlayBtn();
      }

      function updatePlayBtn() {
        playBtn.innerText = isPlaying ? "⏸" : "▶️";
      }

      function nextSong() {
        currentSongIndex = (currentSongIndex + 1) % playlist.length;
        playSong(currentSongIndex);
      }

      function prevSong() {
        currentSongIndex =
          (currentSongIndex - 1 + playlist.length) % playlist.length;
        playSong(currentSongIndex);
      }

      function setVolume(val) {
        audio.volume = val;
      }

      function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? "0" : ""}${sec}`;
      }

      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          const progress = (audio.currentTime / audio.duration) * 100;
          progressBar.value = progress;
          currTimeEl.innerText = formatTime(audio.currentTime);
          durTimeEl.innerText = formatTime(audio.duration);
        }
      });

      audio.addEventListener("ended", nextSong);

      progressBar.addEventListener("input", () => {
        const seekTime = (progressBar.value / 100) * audio.duration;
        audio.currentTime = seekTime;
      });

      init();
    </script>
  </body>
</html>
